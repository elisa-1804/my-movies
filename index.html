<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноТека</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ТЕМНАЯ ТЕМА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            padding-bottom: 80px; /* Отступ снизу для меню */
        }
        
        /* --- ШАПКА ПРИЛОЖЕНИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background-color: #121214;
            z-index: 10;
        }
        header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #ffffff;
        }
        .add-movie-btn {
            background-color: #202024;
            color: #00b37e;
            border: 2px solid #00b37e;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-movie-btn:hover {
            background-color: #00b37e;
            color: #ffffff;
        }

        /* --- СТРАНИЦЫ (ЭКРАНЫ) --- */
        .page {
            display: none; /* По умолчанию скрываем все страницы */
            padding: 0 20px;
        }
        .page.active {
            display: block; /* Показываем только активную */
        }

        /* --- СЕТКА КАРТОЧЕК ФИЛЬМОВ --- */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .movie-card {
            background-color: #202024;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: translateY(-5px);
        }
        .movie-poster {
            width: 100%;
            height: 220px;
            object-fit: cover;
            background-color: #29292e;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 12px;
            color: #8d8d99;
        }

        /* --- НИЖНЕЕ МЕНЮ НАВИГАЦИИ --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #202024;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #29292e;
            z-index: 100;
        }
        .nav-item {
            color: #8d8d99;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            width: 50%;
            height: 100%;
            justify-content: center;
        }
        .nav-item.active {
            color: #00b37e;
        }
        .nav-icon {
            font-size: 20px;
        }

        /* --- ДЕТАЛЬНЫЙ ПРОСМОТР ФИЛЬМА --- */
        .details-container {
            background-color: #202024;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #00b37e;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .details-flex {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .details-poster {
            width: 150px;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }
        .details-content {
            flex: 1;
            min-width: 200px;
        }
        .details-title {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .details-tag {
            display: inline-block;
            background-color: #29292e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-right: 5px;
            margin-bottom: 10px;
        }
        .details-desc {
            margin-top: 15px;
            line-height: 1.5;
            color: #c4c4cc;
        }
        .details-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .fav-btn { background-color: #00b37e; color: white; }
        .fav-btn.is-fav { background-color: #e1e1e6; color: #121214; }
        .del-btn { background-color: #f75a68; color: white; }

        /* --- ФОРМА ДОБАВЛЕНИЯ (МОДАЛЬНОЕ ОКНО) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: #202024;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #29292e;
        }
        .modal-content h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #8d8d99; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #121214;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .form-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <h1 id="pageTitle">Все фильмы</h1>
        <button class="add-movie-btn" onclick="openModal()">+</button>
    </header>

    <!-- СТРАНИЦА 1: ВСЕ ФИЛЬМЫ -->
    <div id="homePage" class="page active">
        <div class="movies-grid" id="moviesGrid"></div>
    </div>

    <!-- СТРАНИЦА 2: ИЗБРАННОЕ -->
    <div id="favoritesPage" class="page">
        <div class="movies-grid" id="favoritesGrid"></div>
    </div>

    <!-- СТРАНИЦА 3: ПОДРОБНОСТИ О ФИЛЬМЕ -->
    <div id="detailsPage" class="page">
        <button class="back-btn" onclick="switchPage('homePage', 'Все фильмы')">← Назад</button>
        <div class="details-container" id="detailsContainer"></div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="switchPage('homePage', 'Все фильмы')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" id="navFav" onclick="switchPage('favoritesPage', 'Избранное')">
            <span class="nav-icon">⭐</span>
            <span>Избранное</span>
        </button>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ФИЛЬМА -->
    <div class="modal" id="addMovieModal">
        <div class="modal-content">
            <h3>Добавить новый фильм</h3>
            <div class="form-group">
                <label>Название фильма *</label>
                <input type="text" id="formTitle" required>
            </div>
            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" id="formYear" placeholder="Например, 2024">
            </div>
            <div class="form-group">
                <label>Жанры (через запятую)</label>
                <input type="text" id="formGenres" placeholder="Драма, Фантастика">
            </div>
            <div class="form-group">
                <label>Ссылка на постер (URL изображения)</label>
                <input type="text" id="formPoster" placeholder="Оставьте пустым для авто-заглушки">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="formDesc" rows="3"></textarea>
            </div>
            <div class="form-buttons">
                <button class="action-btn" style="background-color: #29292e; color: white;" onclick="closeModal()">Отмена</button>
                <button class="action-btn fav-btn" onclick="saveNewMovie()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- ЛОГИКА ПРИЛОЖЕНИЯ (JAVASCRIPT) -->

                id: 1719000000000,
                title: "Интерстеллар",
                year: "2014",
                genres: "Фантастика, Драма",
                poster: "https://unsplash.com",
