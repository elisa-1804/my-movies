<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноТека</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ТЕМНАЯ ТЕМА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            padding-bottom: 90px;
        }
        
        /* --- ШАПКА ПРИЛОЖЕНИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background-color: #121214;
            z-index: 10;
        }
        header h1 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
        }
        .add-movie-btn {
            background-color: #202024;
            color: #00b37e;
            border: 2px solid #00b37e;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* --- СТРАНИЦЫ (ЭКРАНЫ) --- */
        .page {
            display: none;
            padding: 0 20px;
        }
        .page.active {
            display: block;
        }

        /* --- СЕТКА КАРТОЧЕК ФИЛЬМОВ --- */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .movie-card {
            background-color: #202024;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .movie-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 11px;
            color: #8d8d99;
            margin-bottom: 4px;
        }
        .movie-stars {
            font-size: 12px;
            color: #ffb800;
        }

        /* --- НИЖНЕЕ МЕНЮ НАВИГАЦИИ (3 ВКЛАДКИ) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 70px;
            background-color: #202024;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #29292e;
            z-index: 100;
        }
        .nav-item {
            color: #8d8d99;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            width: 33%;
            height: 100%;
            justify-content: center;
        }
        .nav-item.active {
            color: #00b37e;
        }
        .nav-icon {
            font-size: 20px;
        }

        /* --- СТРАНИЦА ЖАНРОВ --- */
        .genre-form {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .genre-list {
            list-style: none;
        }
        .genre-item {
            background-color: #202024;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .genre-actions {
            display: flex;
            gap: 8px;
        }

        /* --- ФОРМЫ И МОДАЛЬНЫЕ ОКНА --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.85);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: #202024;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #29292e;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-content h3 { margin-bottom: 20px; text-align: center; }
        .form-group { 
            display: flex;
            flex-direction: column;
            margin-bottom: 15px; 
        }
        .form-group label { 
            font-size: 13px; 
            color: #8d8d99; 
            margin-bottom: 6px; 
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 10px;
            background-color: #121214;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: white;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: #00b37e;
        }
        .form-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

        /* --- ИНТЕРАКТИВНЫЕ ЗВЕЗДЫ РЕЙТИНГА --- */
        .rating-stars {
            display: flex;
            gap: 8px;
            font-size: 26px;
            cursor: pointer;
            color: #29292e;
        }
        .rating-stars span.active {
            color: #ffb800;
        }

        /* --- КНОПКИ --- */
        .action-btn {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: 600;
        }
        .save-btn { background-color: #00b37e; color: white; }
        .cancel-btn { background-color: #29292e; color: #8d8d99; }
        .del-mini-btn { background-color: #f75a68; color: white; padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; }
        .edit-mini-btn { background-color: #121214; color: #00b37e; border: 1px solid #00b37e; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }

        /* --- СТРАНИЦА ДЕТАЛЕЙ С ФИКСИРОВАННЫМ ВЕРХОМ --- */
        .details-header {
            position: sticky;
            top: 60px;
            background-color: #121214;
            padding: 10px 0;
            z-index: 5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn { background: none; border: none; color: #00b37e; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 5px; }
        .details-container { background-color: #202024; border-radius: 12px; padding: 20px; margin-top: 10px; }
        .details-flex { display: flex; gap: 20px; flex-wrap: wrap; }
        .details-poster { width: 140px; height: 200px; object-fit: cover; border-radius: 8px; }
        .details-content { flex: 1; min-width: 200px; }
        .details-title { font-size: 22px; margin-bottom: 10px; }
        .details-tag { display: inline-block; background-color: #29292e; padding: 4px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; margin-bottom: 10px; }
        .details-desc { margin-top: 15px; line-height: 1.5; color: #c4c4cc; }
        .details-actions { margin-top: 20px; display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <h1 id="pageTitle">Все фильмы</h1>
        <button class="add-movie-btn" id="headerPlusBtn" onclick="openModal('add')">+</button>
    </header>

    <!-- СТРАНИЦА 1: ВСЕ ФИЛЬМЫ -->
    <div id="homePage" class="page active">
        <div class="movies-grid" id="moviesGrid"></div>
    </div>

    <!-- СТРАНИЦА 2: ЖАНРЫ -->
    <div id="genresPage" class="page">
        <div class="genre-form">
            <input type="text" id="genreInput" placeholder="Название жанра..." style="flex:1; padding:10px; background:#202024; border:1px solid #29292e; border-radius:6px; color:white;">
            <button class="action-btn save-btn" onclick="addGenre()">Создать</button>
        </div>
        <ul class="genre-list" id="genreList"></ul>
    </div>

    <!-- СТРАНИЦА 3: ИЗБРАННОЕ -->
    <div id="favoritesPage" class="page">
        <div class="movies-grid" id="favoritesGrid"></div>
    </div>

    <!-- СТРАНИЦА 4: ПОДРОБНОСТИ О ФИЛЬМЕ -->
    <div id="detailsPage" class="page">
        <div class="details-header">
            <button class="back-btn" onclick="switchPage('homePage', 'Все фильмы')">← Назад</button>
            <button class="edit-mini-btn" id="detailsEditBtn">✏️ Редактировать</button>
        </div>
        <div class="details-container" id="detailsContainer"></div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="switchPage('homePage', 'Все фильмы')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" id="navGenres" onclick="switchPage('genresPage', 'Мои жанры')">
            <span class="nav-icon">📂</span>
            <span>Жанры</span>
        </button>
        <button class="nav-item" id="navFav" onclick="switchPage('favoritesPage', 'Избранное')">
            <span class="nav-icon">⭐</span>
            <span>Избранное</span>
        </button>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ФОРМЫ (ДОБАВЛЕНИЕ / РЕДАКТИРОВАНИЕ ФИЛЬМА) -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <h3 id="modalTitle">Новый фильм</h3>
            <input type="hidden" id="formMovieId">
            
            <div class="form-group">
                <label>Наименование фильма *</label>
                <input type="text" id="formTitle" required placeholder="Например, Начало">
            </div>
            
            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" id="formYear" placeholder="Например, 2010">
            </div>
            
            <div class="form-group">
                <label>Жанр фильма</label>
                <select id="formGenreSelect">
                    <option value="">Без жанра</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Моя оценка (Рейтинг)</label>
                <div class="rating-stars" id="formRatingStars">
                    <span data-value="1">★</span>
                    <span data-value="2">★</span>
                    <span data-value="3">★</span>
                    <span data-value="4">★</span>
                    <span data-value="5">★</span>
                </div>
            </div>
            
            <div class="form-group">
                <label>Ссылка на постер из интернета</label>
                <input type="text" id="formPoster" placeholder="Вставьте URL картинки...">
            </div>
            
            <div class="form-group">
                <label>Описание фильма</label>
                <textarea id="formDesc" rows="3" placeholder="Пара слов о сюжете..."></textarea>
            </div>
            
            <div class="form-buttons">
                <button class="action-btn del-mini-btn" id="formDeleteBtn" style="margin-right:auto; display:none;" onclick="deleteMovieForm()">Удалить фильм</button>
                <button class="action-btn cancel-btn" onclick="closeModal()">Отмена</button>
                <button class="action-btn save-btn" onclick="saveMovie()">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО РЕДАКТИРОВАНИЯ ЖАНРА -->
    <div class="modal" id="genreModal">
        <div class="modal-content">
            <h3>Редактировать жанр</h3>
            <input type="hidden" id="editGenreIndex">
            <div class="form-group">
                <label>Название жанра</label>
                <input type="text" id="editGenreInput" required>
            </div>
            <div class="form-buttons">
                <button class="action-btn cancel-btn" onclick="closeGenreModal()">Отмена</button>
                <button class="action-btn save-btn" onclick="saveGenreUpdate()">Сохранить</button>
            </div>
        </div>
    </div>

    <script>
        let movies = JSON.parse(localStorage.getItem('userMovies')) || [];
        let genres = JSON.parse(localStorage.getItem('userGenres')) || ['Драма', 'Комедия', 'Фантастика'];
        let currentRating = 0;

        const defaultPoster = "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80";

        // Настройка выбора звезд в форме
        document.querySelectorAll('#formRatingStars span').forEach(star => {
            star.onclick = function() {
                currentRating = parseInt(this.getAttribute('data-value'));
                updateFormStars(currentRating);
            };
        });

        function updateFormStars(rating) {
            document.querySelectorAll('#formRatingStars span').forEach(star => {
                const val = parseInt(star.getAttribute('data-value'));
                star.classList.toggle('active', val <= rating);
            });
        }

        function getStarsString(rating) {
            let str = '';
            for(let i=1; i<=5; i++) {
                str += i <= rating ? '★' : '☆';
            }
            return str;
        }

        // Переключение вкладок
        function switchPage(pageId, titleText) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('pageTitle').textContent = titleText;

            document.getElementById('headerPlusBtn').style.display = (pageId === 'homePage') ? 'flex' : 'none';

            document.getElementById('navHome').classList.toggle('active', pageId === 'homePage' || pageId === 'detailsPage');
            document.getElementById('navGenres').classList.toggle('active', pageId === 'genresPage');
            document.getElementById('navFav').classList.toggle('active', pageId === 'favoritesPage');

            if (pageId === 'homePage') renderMoviesGrid('moviesGrid', movies);
            if (pageId === 'genresPage') renderGenresList();
            if (pageId === 'favoritesPage') renderMoviesGrid('favoritesGrid', movies.filter(m => m.favorite));
        }

        // Сетка карточек
        function renderMoviesGrid(gridId, list) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            if(list.length === 0) {
                grid.innerHTML = `<p style="color:#8d8d99; text-align:center; grid-column:1/-1; padding:20px;">Список пуст 🎬</p>`;
                return;
            }
            list.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetails(movie.id);
                card.innerHTML = `
                    <img class="movie-poster" src="${movie.poster || defaultPoster}" alt="постер">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">${movie.year || '—'} • ${movie.genre || 'Общий'}</div>
                        <div class="movie-stars">${getStarsString(movie.rating || 0)}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Управление списком жанров
        function renderGenresList() {
            const listElement = document.getElementById('genreList');
            listElement.innerHTML = '';
            genres.forEach((genre, index) => {
                const li = document.createElement('li');
                li.className = 'genre-item';
                li.innerHTML = `
                    <span>${genre}</span>
                    <div class="genre-actions">
                        <button class="edit-mini-btn" onclick="openGenreEdit(${index})">✏️</button>
                        <button class="del-mini-btn" style="padding:4px 8px;" onclick="deleteGenre(${index})">🗑️</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
            updateGenreSelect();
        }

        function addGenre() {
            const input = document.getElementById('genreInput');
            const val = input.value.trim();
            if(val && !genres.includes(val)) {
                genres.push(val);
                localStorage.setItem('userGenres', JSON.stringify(genres));
                input.value = '';
                renderGenresList();
            }
        }

        function deleteGenre(index) {
            const oldName = genres[index];
            if(confirm(`Удалить жанр "${oldName}"? У привязанных фильмов он сбросится.`)) {
                genres.splice(index, 1);
                localStorage.setItem('userGenres', JSON.stringify(genres));
                
                // Сбрасываем у фильмов удаленный жанр
                movies.forEach(m => {
                    if(m.genre === oldName) m.genre = '';
                });
                localStorage.setItem('userMovies', JSON.stringify(movies));
                
                renderGenresList();
            }
        }

        function openGenreEdit(index) {
            document.getElementById('editGenreIndex').value = index;
            document.getElementById('editGenreInput').value = genres[index];
            document.getElementById('genreModal').classList.add('active');
        }

        function closeGenreModal() {
            document.getElementById('genreModal').classList.remove('active');
        }

        function saveGenreUpdate() {
            const index = document.getElementById('editGenreIndex').value;
            const newName = document.getElementById('editGenreInput').value.trim();
            const oldName = genres[index];

            if(newName && !genres.includes(newName)) {
                genres[index] = newName;
                localStorage.setItem('userGenres', JSON.stringify(genres));

                // Обновляем жанр во всех связанных фильмах
                movies.forEach(m => {
                    if(m.genre === oldName) m.genre = newName;
                });
                localStorage.setItem('userMovies', JSON.stringify(movies));

                closeGenreModal();
                renderGenresList();
            } else if (genres.includes(newName) && newName !== oldName) {
                alert("Такой жанр уже существует!");
            }
        }

        function updateGenreSelect() {
            const select = document.getElementById('formGenreSelect');
            select.innerHTML = '<option value="">Без жанра</option>';
            genres.forEach(g => {
                select.innerHTML += `<option value="${g}">${g}</option>`;
            });
        }

        // Работа с формой фильмов (Добавление / Редактирование)
        function openModal(mode, id = null) {
            updateGenreSelect();
            const modal = document.getElementById('movieModal');
            
            if(mode === 'add') {
                document.getElementById('modalTitle').textContent = "Новый фильм";
                document.getElementById('formMovieId').value = "";
                document.getElementById('formTitle').value = "";
                document.getElementById('formYear').value = "";
                document.getElementById('formGenreSelect').value = "";
                document.getElementById('formPoster').value = "";
                document.getElementById('formDesc').value = "";
                document.getElementById('formDeleteBtn').style.display = "none";
                currentRating = 0;
                updateFormStars(0);
            } else if(mode === 'edit') {
                const movie = movies.find(m => m.id === id);
                if(!movie) return;
                
                document.getElementById('modalTitle').textContent = "Редактировать фильм";
                document.getElementById('formMovieId').value = movie.id;
                document.getElementById('formTitle').value = movie.title;
                document.getElementById('formYear').value = movie.year;
                document.getElementById('formGenreSelect').value = movie.genre;
                document.getElementById('formPoster').value = movie.poster;
                document.getElementById('formDesc').value = movie.desc;
                document.getElementById('formDeleteBtn').style.display = "block";
                currentRating = movie.rating || 0;
                updateFormStars(currentRating);
            }
            
            modal.classList.add('active');
        }

        function closeModal() { document.getElementById('movieModal').classList.remove('active'); }

        function saveMovie() {
            const title = document.getElementById('formTitle').value.trim();
            const id = document.getElementById('formMovieId').value;
            
            if (!title) { alert("Укажите наименование фильма!"); return; }

            if(id) {
                // Редактирование
                const movie = movies.find(m => m.id == id);
                if(movie) {
                    movie.title = title;
                    movie.year = document.getElementById('formYear').value.trim();
                    movie.genre = document.getElementById('formGenreSelect').value;
                    movie.poster = document.getElementById('formPoster').value.trim();
                    movie.desc = document.getElementById('formDesc').value.trim();
                    movie.rating = currentRating;
                }
            } else {
                // Создание нового
                const newMovie = {
                    id: Date.now(),
                    title: title,
                    year: document.getElementById('formYear').value.trim(),
                    genre: document.getElementById('formGenreSelect').value,
                    poster: document.getElementById('formPoster').value.trim(),
                    desc: document.getElementById('formDesc').value.trim(),
                    rating: currentRating,
                    favorite: false
                };
                movies.push(newMovie);
            }

            localStorage.setItem('userMovies', JSON.stringify(movies));
            closeModal();
            
            if(id) {
                showDetails(parseInt(id));
            } else {
                switchPage('homePage', 'Все фильмы');
            }
        }

        function deleteMovieForm() {
            const id = document.getElementById('formMovieId').value;
            if(id && confirm("Удалить фильм из коллекции?")) {
                movies = movies.filter(m => m.id != id);
                localStorage.setItem('userMovies', JSON.stringify(movies));
                closeModal();
                switchPage('homePage', 'Все фильмы');
            }
        }

        // Детальный просмотр
        function showDetails(id) {
            const movie = movies.find(m => m.id === id);
            if(!movie) return;
            switchPage('detailsPage', 'О фильме');
            
            // Настраиваем кнопку редактирования в шапке
            document.getElementById('detailsEditBtn').onclick = () => openModal('edit', movie.id);
            
            document.getElementById('detailsContainer').innerHTML = `
                <div class="details-flex">
                    <img class="details-poster" src="${movie.poster || defaultPoster}">
                    <div class="details-content">
                        <h2 class="details-title">${movie.title}</h2>
                        <span class="details-tag">📅 Год: ${movie.year || '—'}</span>
                        <span class="details-tag">🎭 Жанр: ${movie.genre || '—'}</span>
                        <span class="details-tag" style="color:#ffb800;">⭐ Рейтинг: ${getStarsString(movie.rating || 0)}</span>
                        <p class="details-desc">${movie.desc || 'Описание отсутствует.'}</p>
                        <div class="details-actions">
                            <button class="action-btn save-btn" onclick="toggleFav(${movie.id})">${movie.favorite ? '⭐ Избранное' : '☆ В избранное'}</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleFav(id) {
            const movie = movies.find(m => m.id === id);
            if(movie) { movie.favorite = !movie.favorite; localStorage.setItem('userMovies', JSON.stringify(movies)); showDetails(id); }
        }

        renderMoviesGrid('moviesGrid', movies);
    </script>
</body>
</html>
