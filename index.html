<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноТека</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ТЕМНАЯ ТЕМА --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #121214;
            color: #e1e1e6;
            padding-bottom: 80px;
        }
        
        /* --- ШАПКА ПРИЛОЖЕНИЯ --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            position: sticky;
            top: 0;
            background-color: #121214;
            z-index: 10;
        }
        header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }
        .add-movie-btn {
            background-color: #202024;
            color: #00b37e;
            border: 2px solid #00b37e;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .add-movie-btn:hover {
            background-color: #00b37e;
            color: #ffffff;
        }

        /* --- СТРАНИЦЫ (ЭКРАНЫ) --- */
        .page {
            display: none;
            padding: 0 20px;
        }
        .page.active {
            display: block;
        }

        /* --- СЕТКА КАРТОЧЕК ФИЛЬМОВ --- */
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }
        .movie-card {
            background-color: #202024;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .movie-card:hover {
            transform: translateY(-3px);
        }
        .movie-poster {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #29292e;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            font-size: 11px;
            color: #8d8d99;
        }

        /* --- НИЖНЕЕ МЕНЮ НАВИГАЦИИ --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background-color: #202024;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #29292e;
            z-index: 100;
        }
        .nav-item {
            color: #8d8d99;
            text-decoration: none;
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            background: none;
            border: none;
            width: 50%;
            height: 100%;
            justify-content: center;
        }
        .nav-item.active {
            color: #00b37e;
        }
        .nav-icon {
            font-size: 20px;
        }

        /* --- ДЕТАЛЬНЫЙ ПРОСМОТР ФИЛЬМА --- */
        .details-container {
            background-color: #202024;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
        }
        .back-btn {
            background: none;
            border: none;
            color: #00b37e;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .details-flex {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .details-poster {
            width: 130px;
            height: 190px;
            object-fit: cover;
            border-radius: 8px;
        }
        .details-content {
            flex: 1;
            min-width: 200px;
        }
        .details-title {
            font-size: 20px;
            margin-bottom: 10px;
        }
        .details-tag {
            display: inline-block;
            background-color: #29292e;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            margin-right: 5px;
            margin-bottom: 10px;
        }
        .details-desc {
            margin-top: 12px;
            line-height: 1.5;
            color: #c4c4cc;
            font-size: 14px;
        }
        .details-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }
        .action-btn {
            padding: 10px 15px;
            border-radius: 6px;
            border: none;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }
        .fav-btn { background-color: #00b37e; color: white; }
        .fav-btn.is-fav { background-color: #e1e1e6; color: #121214; }
        .del-btn { background-color: #f75a68; color: white; }

        /* --- ФОРМА ДОБАВЛЕНИЯ (МОДАЛЬНОЕ ОКНО) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0,0,0,0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background-color: #202024;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            border: 1px solid #29292e;
        }
        .modal-content h3 { margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; color: #8d8d99; margin-bottom: 5px; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            background-color: #121214;
            border: 1px solid #29292e;
            border-radius: 6px;
            color: white;
            font-size: 14px;
        }
        .form-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <h1 id="pageTitle">Все фильмы</h1>
        <button class="add-movie-btn" onclick="openModal()">+</button>
    </header>

    <!-- СТРАНИЦА 1: ВСЕ ФИЛЬМЫ -->
    <div id="homePage" class="page active">
        <div class="movies-grid" id="moviesGrid"></div>
    </div>

    <!-- СТРАНИЦА 2: ИЗБРАННОЕ -->
    <div id="favoritesPage" class="page">
        <div class="movies-grid" id="favoritesGrid"></div>
    </div>

    <!-- СТРАНИЦА 3: ПОДРОБНОСТИ О ФИЛЬМЕ -->
    <div id="detailsPage" class="page">
        <button class="back-btn" onclick="switchPage('homePage', 'Все фильмы')">← Назад</button>
        <div class="details-container" id="detailsContainer"></div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
    <nav class="bottom-nav">
        <button class="nav-item active" id="navHome" onclick="switchPage('homePage', 'Все фильмы')">
            <span class="nav-icon">🏠</span>
            <span>Главная</span>
        </button>
        <button class="nav-item" id="navFav" onclick="switchPage('favoritesPage', 'Избранное')">
            <span class="nav-icon">⭐</span>
            <span>Избранное</span>
        </button>
    </nav>

    <!-- МОДАЛЬНОЕ ОКНО ДОБАВЛЕНИЯ ФИЛЬМА -->
    <div class="modal" id="addMovieModal">
        <div class="modal-content">
            <h3>Добавить новый фильм</h3>
            <div class="form-group">
                <label>Название фильма *</label>
                <input type="text" id="formTitle" required>
            </div>
            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" id="formYear" placeholder="Например, 2024">
            </div>
            <div class="form-group">
                <label>Жанры (через запятую)</label>
                <input type="text" id="formGenres" placeholder="Драма, Фантастика">
            </div>
            <div class="form-group">
                <label>Ссылка на постер (URL изображения)</label>
                <input type="text" id="formPoster" placeholder="Оставьте пустым для авто-заглушки">
            </div>
            <div class="form-group">
                <label>Описание</label>
                <textarea id="formDesc" rows="3"></textarea>
            </div>
            <div class="form-buttons">
                <button class="action-btn" style="background-color: #29292e; color: white;" onclick="closeModal()">Отмена</button>
                <button class="action-btn fav-btn" onclick="saveNewMovie()">Добавить</button>
            </div>
        </div>
    </div>

    <!-- ЛОГИКА ПРИЛОЖЕНИЯ -->
    <script>
        // База данных фильмов в памяти браузера (изначально пустая)
        let movies = JSON.parse(localStorage.getItem('cinemaData')) || [];

        // 1. Переключение страниц
        function switchPage(pageId, titleText) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            
            document.getElementById('pageTitle').textContent = titleText;

            document.getElementById('navHome').classList.toggle('active', pageId === 'homePage' || pageId === 'detailsPage');
            document.getElementById('navFav').classList.toggle('active', pageId === 'favoritesPage');

            if (pageId === 'homePage') renderGrid('moviesGrid', movies);
            if (pageId === 'favoritesPage') renderGrid('favoritesGrid', movies.filter(m => m.favorite));
        }

        // 2. Отрисовка списков
        function renderGrid(gridId, itemsList) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';

            if (itemsList.length === 0) {
                grid.innerHTML = `<p style="color:#8d8d99; grid-column: 1/-1; text-align:center; padding: 40px 0; font-size: 14px;">Тут пока пусто 🎬<br>Нажмите на плюс сверху, чтобы добавить фильм</p>`;
                return;
            }

            itemsList.forEach(movie => {
                const defaultPoster = "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80";
                const posterSrc = (movie.poster && movie.poster.trim() !== "") ? movie.poster : defaultPoster;
                
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => showDetails(movie.id);
                card.innerHTML = `
                    <img class="movie-poster" src="${posterSrc}" alt="${movie.title}">
                    <div class="movie-info">
                        <div class="movie-title">${movie.title}</div>
                        <div class="movie-meta">${movie.year ? movie.year : '—'} • ${movie.genres ? movie.genres : 'Общий'}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. Открытие детальной информации о фильме
        function showDetails(movieId) {
            const movie = movies.find(m => m.id === movieId);
            if (!movie) return;

            switchPage('detailsPage', 'О фильме');
            
            const container = document.getElementById('detailsContainer');
            const defaultPoster = "https://images.unsplash.com/photo-1485846234645-a62644f84728?w=500&q=80";
            const posterSrc = (movie.poster && movie.poster.trim() !== "") ? movie.poster : defaultPoster;

            container.innerHTML = `
                <div class="details-flex">
                    <img class="details-poster" src="${posterSrc}">
                    <div class="details-content">
                        <h2 class="details-title">${movie.title}</h2>
                        <div>
                            <span class="details-tag">📅 Год: ${movie.year || '—'}</span>
                            <span class="details-tag">🎭 Жанры: ${movie.genres || '—'}</span>
                        </div>
                        <p class="details-desc">${movie.desc || 'Описание отсутствует.'}</p>
                        
                        <div class="details-actions">
                            <button class="action-btn fav-btn ${movie.favorite ? 'is-fav' : ''}" onclick="toggleFavorite(${movie.id})">
                                ${movie.favorite ? '⭐ В избранном' : '☆ В избранное'}
                            </button>
                            <button class="action-btn del-btn" onclick="deleteMovie(${movie.id})">Удалить</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // 4. Логика Избранного и Удаления
        function toggleFavorite(id) {
            const movie = movies.find(m => m.id === id);
            if (movie) {
                movie.favorite = !movie.favorite;
                saveData();
                showDetails(id);
            }
        }

        function deleteMovie(id) {
            if (confirm("Точно удалить этот фильм?")) {
                movies = movies.filter(m => m.id !== id);
                saveData();
                switchPage('homePage', 'Все фильмы');
            }
        }

        // 5. Управление модальным окном формы
        function openModal() { document.getElementById('addMovieModal').classList.add('active'); }
        function closeModal() { document.getElementById('addMovieModal').classList.remove('active'); }

        function saveNewMovie() {
            const title = document.getElementById('formTitle').value.trim();
            if (!title) { alert("Название фильма обязательно!"); return; }

            const newMovie = {
                id: Date.now(),
                title: title,
                year: document.getElementById('formYear').value.trim(),
                genres: document.getElementById('formGenres').value.trim(),
                poster: document.getElementById('formPoster').value.trim(),
                desc: document.getElementById('formDesc').value.trim(),
                favorite: false
            };

            movies.push(newMovie);
            saveData();
            closeModal();
            
            document.getElementById('formTitle').value = '';
            document.getElementById('formYear').value = '';
            document.getElementById('formGenres').value = '';
            document.getElementById('formPoster').value = '';
            document.getElementById('formDesc').value = '';

            switchPage('homePage', 'Все фильмы');
        }

        function saveData() {
            localStorage.setItem('cinemaData', JSON.stringify(movies));
        }

        // Запуск при старте
        renderGrid('moviesGrid', movies);
    </script>
</body>
</html>
