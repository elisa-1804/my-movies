<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>КиноТека</title>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем библиотеку Supabase, чтобы облако работало -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
    <!-- Экран авторизации (показывается первым) -->
    <div id="authPage" class="auth-container">
        <div class="auth-card">
            <h2 id="authTitle">Войти в профиль</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="authEmail" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" id="authPassword" placeholder="Минимум 6 символов">
            </div>
            <button class="action-btn save-btn" style="width:100%; margin-top:10px;" id="authPrimaryBtn" onclick="handleAuth()">Войти</button>
            <span class="auth-toggle" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</span>
        </div>
    </div>

    <!-- Основное приложение (скрыто до входа) -->
    <div id="appContent" style="display: none;">
        <header>
            <h1 id="pageTitle">Все фильмы</h1>
            <div style="display:flex; gap:15px; align-items:center;">
                <button class="add-movie-btn" id="headerPlusBtn" onclick="openModal()">+</button>
                <!-- Вот она, наша кнопочка выхода -->
                <button onclick="logout()" style="background:none; border:none; font-size:20px; cursor:pointer;">🚪</button>
            </div>
        </header>

        <div id="homePage" class="page active"><div class="movies-grid" id="moviesGrid"></div></div>
        <div id="favoritesPage" class="page"><div class="movies-grid" id="favoritesGrid"></div></div>
        <div id="genresPage" class="page">
            <div class="genre-form">
                <input type="text" id="genreInput" placeholder="Название жанра...">
                <button class="action-btn save-btn" onclick="addGenre()">Создать</button>
            </div>
            <ul class="genre-list" id="genreList"></ul>
        </div>

        <div id="detailsPage" class="page">
            <div class="details-header-panel">
                <button class="back-btn" onclick="switchPage('homePage', 'Все фильмы')">← Назад</button>
                <button class="edit-icon-btn" id="movieEditBtn">✏️</button>
            </div>
            <div class="details-container" id="detailsContainer"></div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" id="navHome" onclick="switchPage('homePage', 'Все фильмы')"><span class="nav-icon">🏠</span><span>Главная</span></button>
            <button class="nav-item" id="navFav" onclick="switchPage('favoritesPage', 'Избранное')"><span class="nav-icon">⭐</span><span>Избранное</span></button>
            <button class="nav-item" id="navGenres" onclick="switchPage('genresPage', 'Мои жанры')"><span class="nav-icon">📂</span><span>Жанры</span></button>
        </nav>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ФИЛЬМА -->
    <div class="modal" id="addMovieModal">
        <div class="modal-content">
            <h3 id="modalHeadline">Новый фильм</h3>
            <input type="hidden" id="formMovieId">
            <div class="form-group">
                <label>Наименование фильма *</label>
                <input type="text" id="formTitle" required>
            </div>
            <div class="form-group">
                <label>Год выпуска</label>
                <input type="number" id="formYear">
            </div>
            <div class="form-group">
                <label>Жанр фильма</label>
                <select id="formGenreSelect"><option value="">Без жанра</option></select>
            </div>
            <div class="form-group">
                <label>Моя оценка</label>
                <div class="rating-stars" id="formRatingStars">
                    <span onclick="setFormRating(1)">★</span><span onclick="setFormRating(2)">★</span><span onclick="setFormRating(3)">★</span><span onclick="setFormRating(4)">★</span><span onclick="setFormRating(5)">★</span>
                </div>
            </div>
            <div class="form-group">
                <label>Ссылка на постер из интернета</label>
                <input type="text" id="formPoster">
            </div>
            <div class="form-group">
                <label>Описание фильма</label>
                <textarea id="formDesc" rows="3"></textarea>
            </div>
            <div class="form-buttons">
                <button class="del-mini-btn" id="formDeleteBtn" style="display:none;" onclick="deleteMovieFromForm()">Удалить</button>
                <div style="display:flex; gap:10px; margin-left:auto;">
                    <button class="action-btn cancel-btn" onclick="closeModal()">Отмена</button>
                    <button class="action-btn save-btn" onclick="saveMovie()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЖАНРА -->
    <div class="modal" id="genreModal">
        <div class="modal-content">
            <h3>Редактировать жанр</h3>
            <input type="hidden" id="editGenreId">
            <div class="form-group">
                <label>Название жанра</label>
                <input type="text" id="editGenreInput">
            </div>
            <div class="form-buttons">
                <button class="del-mini-btn" onclick="deleteGenreFromModal()">🗑️ Удалить</button>
                <div style="display:flex; gap:10px; margin-left:auto;">
                    <button class="action-btn cancel-btn" onclick="closeGenreModal()">Отмена</button>
                    <button class="action-btn save-btn" onclick="saveGenreChanges()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

<script>
const SUPABASE_URL = "https://ppjezzfhwsartggywzyp.supabase.co";
const SUPABASE_KEY = "sb_publishable_ChDY37tmdQzyKO_xUe_kEw_D5zTO4og";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null, movies = [], genres = [], currentFormRating = 0, isSignUpMode = false;
    const defaultPoster = "https://unsplash.com";

    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('authTitle').textContent = isSignUpMode ? "Регистрация" : "Войти в профиль";
        document.getElementById('authPrimaryBtn').textContent = isSignUpMode ? "Создать аккаунт" : "Войти";
        document.getElementById('authPrimaryBtn').nextElementSibling.textContent = isSignUpMode ? "Уже есть аккаунт? Войти" : "Нет аккаунта? Зарегистрироваться";
    }
    async function handleAuth() {
        const email = document.getElementById('authEmail').value.trim();
        const password = document.getElementById('authPassword').value.trim();
        if(!email || !password) { alert("Заполните все поля!"); return; }
        if(isSignUpMode) {
            const { error } = await supabase.auth.signUp({ email, password });
            if(error) { alert("Ошибка: " + error.message); return; }
            alert("Успешно! Теперь войдите."); toggleAuthMode();
        } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if(error) { alert("Ошибка: " + error.message); return; }
            checkUser();
        }
    }
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        if(user) { currentUser = user; document.getElementById('authPage').style.display = 'none'; document.getElementById('appContent').style.display = 'block'; loadData(); } 
        else { document.getElementById('authPage').style.display = 'flex'; document.getElementById('appContent').style.display = 'none'; }
    }
    async function logout() { await supabase.auth.signOut(); currentUser = null; checkUser(); }
    async function loadData() {
        if(!currentUser) return;
        let { data: gData } = await supabase.from('genres').select('*').eq('user_id', currentUser.id);
        genres = gData ? gData.map(g => g.name) : [];
        let { data: mData } = await supabase.from('movies').select('*').eq('user_id', currentUser.id);
        movies = mData || [];
        renderMoviesGrid('moviesGrid', movies); updateGenreSelect();
    }
    function switchPage(pageId, titleText) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        document.getElementById('pageTitle').textContent = titleText;
        document.getElementById('headerPlusBtn').style.display = (pageId === 'homePage') ? 'flex' : 'none';
        if (pageId === 'homePage') renderMoviesGrid('moviesGrid', movies);
        if (pageId === 'genresPage') renderGenresList();
        if (pageId === 'favoritesPage') renderMoviesGrid('favoritesGrid', movies.filter(m => m.favorite));
    }
    function getStarsHtml(r) { let h = ''; for(let i=1; i<=5; i++) { h += i <= r ? '★' : '☆'; } return h; }
    function renderMoviesGrid(gridId, list) {
        const grid = document.getElementById(gridId); grid.innerHTML = '';
        if(list.length === 0) { grid.innerHTML = `<p style="color:#8d8d99; text-align:center; grid-column:1/-1; padding:20px;">Список пуст 🎬</p>`; return; }
        list.forEach(m => {
            const card = document.createElement('div'); card.className = `movie-card ${m.favorite ? 'is-fav' : ''}`; card.onclick = () => showDetails(m.id);
            card.innerHTML = `<img class="movie-poster" src="${m.poster || defaultPoster}"><div class="card-fav-badge">❤️</div><div class="movie-info"><div class="movie-title">${m.title}</div><div class="movie-meta">${m.year || '—'} • ${m.genre || 'Общий'}</div><div class="card-stars">${getStarsHtml(m.rating || 0)}</div></div>`;
            grid.appendChild(card);
        });
    }
    async function renderGenresList() {
        const { data: gData } = await supabase.from('genres').select('*').eq('user_id', currentUser.id);
        const list = document.getElementById('genreList'); list.innerHTML = '';
        if (gData) { gData.forEach(g => { const li = document.createElement('li'); li.className = 'genre-item'; li.innerHTML = `<span>${g.name}</span><button class="genre-edit-btn" onclick="openGenreModal('${g.id}', '${g.name}')">✏️</button>`; list.appendChild(li); }); }
        updateGenreSelect();
    }
    async function addGenre() { const input = document.getElementById('genreInput'); const val = input.value.trim(); if(val && currentUser) { await supabase.from('genres').insert([{ name: val, user_id: currentUser.id }]); input.value = ''; renderGenresList(); } }
    function openGenreModal(id, name) { document.getElementById('editGenreId').value = id; document.getElementById('editGenreInput').value = name; document.getElementById('genreModal').classList.add('active'); }
    function closeGenreModal() { document.getElementById('genreModal').classList.remove('active'); }
    async function saveGenreChanges() { const id = document.getElementById('editGenreId').value; const name = document.getElementById('editGenreInput').value.trim(); if(!name) return; await supabase.from('genres').update({ name }).eq('id', id); closeGenreModal(); loadData(); renderGenresList(); }
    async function deleteGenreFromModal() { const id = document.getElementById('editGenreId').value; if(confirm("Удалить жанр?")) { await supabase.from('genres').delete().eq('id', id); closeGenreModal(); loadData(); renderGenresList(); } }
    function updateGenreSelect() { const select = document.getElementById('formGenreSelect'); if(!select) return; select.innerHTML = '<option value="">Без жанра</option>'; genres.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; }); }
    function setFormRating(r) { currentFormRating = r; document.querySelectorAll('#formRatingStars span').forEach((s, i) => { s.classList.toggle('active', i < r); }); }
    function openModal(editId = null) {
        updateGenreSelect(); const deleteBtn = document.getElementById('formDeleteBtn');
        if(editId) {
            const m = movies.find(x => x.id === editId); document.getElementById('modalHeadline').textContent = "Редактировать фильм"; document.getElementById('formMovieId').value = m.id; document.getElementById('formTitle').value = m.title; document.getElementById('formYear').value = m.year; document.getElementById('formGenreSelect').value = m.genre; document.getElementById('formPoster').value = m.poster; document.getElementById('formDesc').value = m.desc; setFormRating(m.rating || 0); deleteBtn.style.display = 'block';
        } else {
            document.getElementById('modalHeadline').textContent = "Новый фильм"; document.getElementById('formMovieId').value = ''; document.getElementById('formTitle').value = ''; document.getElementById('formYear').value = ''; document.getElementById('formGenreSelect').value = ''; document.getElementById('formPoster').value = ''; document.getElementById('formDesc').value = ''; setFormRating(0); deleteBtn.style.display = 'none';
        }
        document.getElementById('addMovieModal').classList.add('active');
    }
    function closeModal() { document.getElementById('addMovieModal').classList.remove('active'); }
    async function saveMovie() {
        const title = document.getElementById('formTitle').value.trim(); if (!title) { alert("Укажите название!"); return; }
        const id = document.getElementById('formMovieId').value;
        const mData = { title, year: document.getElementById('formYear').value.trim(), genre: document.getElementById('formGenreSelect').value, poster: document.getElementById('formPoster').value.trim(), desc: document.getElementById('formDesc').value.trim(), rating: currentFormRating, user_id: currentUser.id };
        if(id) { await supabase.from('movies').update(mData).eq('id', id); } else { mData.favorite = false; await supabase.from('movies').insert([mData]); }
        closeModal(); await loadData(); if(id) { showDetails(Number(id)); } else { switchPage('homePage', 'Все фильмы'); }
    }
    async function deleteMovieFromForm() { const id = document.getElementById('formMovieId').value; if(id && confirm("Удалить фильм?")) { await supabase.from('movies').delete().eq('id', id); closeModal(); await loadData(); switchPage('homePage', 'Все фильмы'); } }
    function showDetails(id) {
        const m = movies.find(x => x.id == id); if(!m) return; switchPage('detailsPage', 'О фильме'); document.getElementById('movieEditBtn').onclick = () => openModal(m.id);
        const c = document.getElementById('detailsContainer'); c.className = `details-container ${m.favorite ? 'is-fav' : ''}`;
        c.innerHTML = `<div class="details-flex"><img class="details-poster" src="${m.poster || defaultPoster}"><div class="details-content"><div class="details-top-row"><h2 class="details-title">${m.title}</h2><button class="heart-btn" onclick="toggleFav(${m.id})">${m.favorite ? '❤️' : '🤍'}</button></div><span class="details-tag">📅 Год: ${m.year || '—'}</span><span class="details-tag">🎭 Жанр: ${m.genre || '—'}</span><span class="details-tag" style="color:#fba94c">⭐ Рейтинг: ${getStarsHtml(m.rating || 0)}</span><p class="details-desc">${m.desc || 'Описание отсутствует.'}</p></div></div>`;
    }
    async function toggleFav(id) { const m = movies.find(x => x.id == id); if(m) { await supabase.from('movies').update({ favorite: !m.favorite }).eq('id', id); await loadData(); showDetails(id); } }
    checkUser();
</script>
    
</body>
</html>
